services:
  - type: web
    name: vetted-crustdata
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn vetted.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/summary
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: MAX_RUNS_PER_HOUR
        value: "30"
      - key: CRUSTDATA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VENDOR_CONTACT_EMAIL
        sync: false
      - key: APPROVERS
        sync: false
